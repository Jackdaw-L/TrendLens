name: Update TrendLens interest profile

on:
  # Supabase Cron dispatches on Sunday at 21:07 Asia/Shanghai.
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase scheduled job ID (empty for a manual run)
        required: false
        default: ""
      reason:
        description: Why this run was started
        required: false
        default: manual

concurrency:
  group: trendlens-weekly-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRENDLENS_JOB_ID: ${{ inputs.job_id }}
      DEEPSEEK_API_URL: https://api.deepseek.com/chat/completions
      DEEPSEEK_MODEL: deepseek-flash
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_THINKING: disabled
      DEEPSEEK_MAX_TOKENS: "12000"
      DEEPSEEK_ATTEMPTS: "2"
      DEEPSEEK_TIMEOUT_MS: "180000"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PROFILE_WINDOW_DAYS: "14"
      PROFILE_MAX_NEW_SOURCES: "2"
      PROFILE_REMOVE_FAIL_STREAK: "7"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up pnpm
        run: npm install -g pnpm@10.18.0

      - name: Install dependencies
        run: pnpm install --prod --no-frozen-lockfile --ignore-scripts

      - name: Update interest profile, source weights, and source proposals
        run: node scripts/run-job.mjs weekly
